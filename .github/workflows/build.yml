name: Build Sangvya APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sangvya Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip & Auto-Fix Project
        run: |
          unzip -o *.zip
          if [ -d "Sangvya" ]; then
            cp -r Sangvya/* . || true
          fi
          python3 -c "
          patches = [
              ('app/src/main/java/com/sangvya/app/ui/screens/GroupChatScreen.kt', 'import androidx.compose.ui.text.font.FontWeight'),
              ('app/src/main/java/com/sangvya/app/ui/screens/LocationRadarScreen.kt', 'import androidx.compose.foundation.layout.size')
          ]
          for path, imp in patches:
              try:
                  with open(path, 'r') as f:
                      content = f.read()
                  if imp not in content:
                      content = content.replace('package com.sangvya.app.ui.screens', 'package com.sangvya.app.ui.screens\n\n' + imp)
                      with open(path, 'w') as f:
                          f.write(content)
              except Exception as e:
                  print(e)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sangvya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
